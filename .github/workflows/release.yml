name: Release Linux binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Verify executable
        run: |
          ./target/release/prestui --version
          ./target/release/prestui --help > /dev/null

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          archive="prestui-${RELEASE_TAG}-linux-x86_64"
          mkdir -p "dist/${archive}"
          cp target/release/prestui LICENSE README.md "dist/${archive}/"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"
          (cd dist && sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256")

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="prestui-${RELEASE_TAG}-linux-x86_64"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null
          gh release upload "${RELEASE_TAG}" "dist/${archive}.tar.gz" "dist/${archive}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber
